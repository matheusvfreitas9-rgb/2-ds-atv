<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Império das Sombras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <div class="card">

            <!-- Header -->
            <div class="card-header text-center">
                Império das Sombras - Criado por Matheus
            </div>

            <!-- Body -->
            <div class="card-body"
                style="
                    background-image: url('./assets/sky.gif');
                    background-size: cover;
                    background-position: center;
                    background-repeat: no-repeat;
                    min-height: 500px;
                ">

                <div class="row">

                    <!-- CERBERUS -->
                    <div class="col">

                        <ul class="list-group text-end">

                            <li class="list-group-item">
                                <strong id="cerberus">
                                    Cerberus
                                </strong>
                            </li>

                            <li class="list-group-item"
                                id="classe-cerberus">
                                Mestre das Névoas
                            </li>

                            <!-- HP -->
                            <li class="list-group-item">
                                ❤️
                                <progress id="hp-boss"
                                          value="100"
                                          max="150"
                                          style="accent-color:red;">
                                </progress>
                            </li>

                            <!-- MANA -->
                            <li class="list-group-item">
                                🧪
                                <progress value="100"
                                          max="100"
                                          style="accent-color:lightblue;">
                                </progress>
                            </li>

                            <!-- ENERGIA -->
                            <li class="list-group-item">
                                ⚡
                                <progress value="100"
                                          max="100"
                                          style="accent-color:green;">
                                </progress>
                            </li>

                        </ul>

                    </div>

                    <!-- VALKALA -->
                    <div class="col">

                        <ul class="list-group">

                            <li class="list-group-item">
                                <strong id="valkala">
                                    Valkala
                                </strong>
                            </li>

                            <li class="list-group-item"
                                id="classe-valkala">
                                Caçador Sombrio
                            </li>

                            <!-- HP -->
                            <li class="list-group-item">
                                ❤️
                                <progress value="100"
                                          max="100"
                                          style="accent-color:red;">
                                </progress>
                            </li>

                            <!-- MANA -->
                            <li class="list-group-item">
                                🧪
                                <progress id="mp-hero"
                                          value="100"
                                          max="100"
                                          style="accent-color:lightblue;">
                                </progress>
                            </li>

                            <!-- ENERGIA -->
                            <li class="list-group-item">
                                ⚡
                                <progress id="en-hero"
                                          value="100"
                                          max="150"
                                          style="accent-color:green;">
                                </progress>
                            </li>

                        </ul>

                    </div>

                </div>

                <!-- Imagens -->
                <div class="row mt-3">

                    <!-- IMG CERBERUS -->
                    <div class="col text-end">

                        <img src="./assets/cerberus.gif"
                             width="200"
                             height="200"
                             alt="Cerberus">

                    </div>

                    <!-- IMG VALKALA -->
                    <div class="col">

                        <img src="./assets/valkala.gif"
                             width="200"
                             height="200"
                             alt="Valkala">

                    </div>

                </div>

                <!-- BOTÕES -->
                <div class="row mt-4">

                    <div class="col text-center">

                        <div id="controles">

                        </div>

                    </div>

                </div>

            </div>

            <!-- Footer -->
            <div class="card-footer text-center">
                Confronto Final
            </div>

        </div>

    </div>

    <script src="./javascript.js"></script>

</body>

</html>
